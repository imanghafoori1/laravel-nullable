name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3]
        laravel: [6.*, 7.*, 8.*, 9.*, 10.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 7.2
            laravel: 8.*
          - php: 7.2
            laravel: 9.*
          - php: 7.2
            laravel: 10.*

          - php: 7.3
            laravel: 9.*
          - php: 7.3
            laravel: 10.*

          - php: 7.4
            laravel: 9.*
          - php: 7.4
            laravel: 10.*

          - php: 8.0
            laravel: 6.*
          - php: 8.0
            laravel: 10.*

          - php: 8.1
            laravel: 6.*
          - php: 8.1
            laravel: 8.*
          - php: 8.1
            laravel: 7.*

          - php: 8.2
            laravel: 6.*
          - php: 8.2
            laravel: 7.*
          - php: 8.2
            laravel: 8.*

          - php: 8.3
            laravel: 6.*
          - php: 8.3
            laravel: 7.*
          - php: 8.3
            laravel: 8.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, bcmath, gd, pdo, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit
